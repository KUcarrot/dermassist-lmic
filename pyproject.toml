[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dermassist-lmic"
version = "1.0.0"
description = "Offline-first AI dermatology screening for Sub-Saharan Africa and LMICs"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Donggeun Kim", email = "jikksun@korea.ac.kr"}
]
keywords = [
    "dermatology",
    "medical-ai",
    "gemma",
    "lora",
    "LMIC",
    "offline-ai",
    "skin-cancer-screening",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
requires-python = ">=3.10"

# IMPORTANT: Dependency versions are strictly pinned to the tested environment.
# This combination is verified on RTX 4080 16GB VRAM, Windows, Python 3.10.
#
# NOTE on PyTorch: Install torch/torchvision with the CUDA 12.4 wheel index BEFORE
# running `pip install -e .`:
#   pip install torch==2.6.0 torchvision==0.21.0 \
#     --extra-index-url https://download.pytorch.org/whl/cu124
dependencies = [
    # Core ML - strict version pinning required for Gemma 4 compatibility
    "torch==2.6.0",
    "torchvision==0.21.0",
    "transformers==5.5.4",          # Gemma 4 support (do not downgrade)
    "peft==0.19.1",
    "bitsandbytes==0.49.2",
    "accelerate==1.13.0",
    "sentence-transformers==3.1.1",
    "safetensors==0.7.0",
    "tokenizers==0.22.2",
    # Vision
    "Pillow==10.4.0",
    "opencv-python==4.13.0.92",
    "timm==1.0.9",
    "scikit-image==0.24.0",
    # RAG
    "PyMuPDF==1.27.2.2",            # PDF text extraction
    # UI
    "gradio==6.13.0",
    # Data - keep numpy 1.x (2.x has compatibility issues with some dependencies)
    "pandas==2.2.3",
    "numpy==1.26.4",                # Do not upgrade to NumPy 2.x
    "matplotlib==3.9.2",
    "seaborn==0.13.2",
    "tqdm==4.66.6",
    "scikit-learn==1.5.2",
    # Utilities
    "python-dotenv==1.0.1",         # .env file for HF_TOKEN
    "requests>=2.31.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Training dependencies (not required for inference)
training = [
    "datasets==4.8.4",
    "trl==1.2.0",
    "diffusers==0.31.0",            # Synthetic data generation (Stable Diffusion)
    "albumentations==1.4.16",       # Medical image augmentation
]
# Development tools
dev = [
    "pytest>=7.4.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.urls]
Repository = "https://github.com/KUcarrot/dermassist-lmic"
Documentation = "https://github.com/KUcarrot/dermassist-lmic/blob/main/README.md"
"Bug Tracker" = "https://github.com/KUcarrot/dermassist-lmic/issues"

[project.scripts]
dermassist-demo = "dermassist.ui.gradio_app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.woff2", "*.md"]
